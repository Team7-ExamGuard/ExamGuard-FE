name: ci

# PR을 열거나 main에 push할 때 설치·테스트·빌드 확인
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json 그대로 설치
      - run: npm ci

      - run: npm test -- --watchAll=false

      # GitHub Actions는 CI=true라 ESLint 경고도 빌드 실패로 처리됨
      # .env는 git에 없으므로 mock 설정을 직접 지정
      - run: npm run build
        env:
          REACT_APP_USE_MOCK: "true"
